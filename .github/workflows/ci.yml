name: Neocortex CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

concurrency:
  group: neocortex-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast lint · Ubuntu · Python 3.14
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Bootstrap audited pip
        run: python -I tools/bootstrap_pip.py

      - name: Install constrained analysis runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraints constraints.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraint constraints.txt ".[analysis]"

      - name: Ruff changed-source contracts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "$base" "$GITHUB_SHA" -- '*.py')
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD -- '*.py')
          fi
          targets=()
          for candidate in "${changed[@]}"; do
            [[ -f "$candidate" ]] && targets+=("$candidate")
          done
          ((${#targets[@]})) || targets=("_04_Nucleo_Operativo/code_contracts.py")
          printf 'Ruff target: %s\n' "${targets[@]}"
          python -m ruff check --no-cache "${targets[@]}"
          python -m ruff format --check --no-cache "${targets[@]}"

      - name: Verify final candidate snapshot
        if: always()
        run: python tools/quality_gate.py git-snapshot --sha "$GITHUB_SHA"

  quality:
    name: Coverage · live contracts · supply chain · static baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind gate evidence to the candidate SHA
        run: |
          set -euo pipefail
          observed=$(git rev-parse HEAD)
          test "$observed" = "$GITHUB_SHA"
          printf 'candidate_sha=%s\n' "$observed"

      - name: Set up CPython 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node for canonical Pyright
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Bootstrap audited pip
        run: python -I tools/bootstrap_pip.py

      - name: Install constrained full source and Pyright
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraints constraints.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraint constraints.txt ".[full]"
          python -m pip check
          python -I tools/pyright_runtime.py install --target "$RUNNER_TEMP/pyright"
          echo "$RUNNER_TEMP/pyright/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prove complete dynamic test inventory
        run: python tools/quality_gate.py inventory --shard-count 2

      - name: Enforce complete branch-aware coverage baseline
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python tools/quality_gate.py coverage \
            --data-file "$RUNNER_TEMP/neocortex-coverage/.coverage" \
            --report "$RUNNER_TEMP/neocortex-coverage/coverage.json" \
            --basetemp "$RUNNER_TEMP/pytest-coverage"

      - name: Verify candidate snapshot after coverage
        run: python tools/quality_gate.py git-snapshot --sha "$GITHUB_SHA"

      - name: Publish complete branch-aware coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neocortex-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/neocortex-coverage/coverage.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live Grimp architecture contracts
        run: python tools/quality_gate.py architecture

      - name: Reverify locked Pyright runtime after untrusted tests
        run: |
          set -euo pipefail
          python -I tools/pyright_runtime.py verify --target "$RUNNER_TEMP/pyright"
          test "$(pyright --version)" = "pyright 1.1.411"

      - name: Enforce Ruff, Mypy and Pyright no-regression baseline
        run: python tools/quality_gate.py static

      - name: Provision, verify and audit the isolated Semgrep tool runtime
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/neocortex-runtime"
          python tools/semgrep_tool_runtime.py install --runtime-root "$runtime"
          python tools/semgrep_tool_runtime.py verify --runtime-root "$runtime"
          python tools/quality_gate.py supply-chain \
            --tool-receipt "$runtime/tools/semgrep/neocortex-tool-runtime.json"

      - name: Verify final candidate snapshot
        if: always()
        run: python tools/quality_gate.py git-snapshot --sha "$GITHUB_SHA"

  standard:
    name: Wheel + source shard ${{ matrix.shard }} · ${{ matrix.os }} · Python ${{ matrix.python }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
        shard: [0, 1]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Bootstrap audited pip
        shell: bash
        run: python -I tools/bootstrap_pip.py

      - name: Install Ubuntu Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1

      - name: Build constrained wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          mkdir -p "$RUNNER_TEMP/neocortex-wheel"
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-wheel" \
            --constraints constraints.txt
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/neocortex-wheel"
          [[ $(find "$RUNNER_TEMP/neocortex-wheel" -maxdepth 1 -name 'neocortex_framework-*.whl' | wc -l) -eq 1 ]]

      - name: Install full wheel using binary artifacts only
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$RUNNER_TEMP/neocortex-wheel" -maxdepth 1 -name 'neocortex_framework-*.whl' -print -quit)
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --find-links "$RUNNER_TEMP/neocortex-wheel" \
            --constraint constraints.txt "${wheel}[full]"
          python -m pip check

      - name: Execute the installed wheel imports and public entrypoint
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/wheel-origin-probe"
          python tools/quality_gate.py wheel-smoke --probe-directory "$probe"
          cd "$probe"
          python -I -m neocortex doctor platform --json
          python -I -c "import PIL,PySide6,ctranslate2,fastembed,faster_whisper,fitz,nudenet,numpy,pytesseract"

      - name: Complete source suite shard
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python tools/quality_gate.py tests \
            --shard-count 2 \
            --shard-index "${{ matrix.shard }}" \
            --basetemp "$RUNNER_TEMP/pytest-standard-${{ matrix.shard }}"

      - name: Verify final candidate snapshot
        if: always()
        shell: bash
        run: python tools/quality_gate.py git-snapshot --sha "$GITHUB_SHA"

  deep-windows:
    name: Deep Windows NTFS · Python 3.14
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Bootstrap audited pip
        shell: pwsh
        run: |
          python -I tools/bootstrap_pip.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install full constrained source and Pyright
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --constraint constraints.txt build==1.5.0 setuptools==83.0.0 wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_binary_inputs.py --wheel-dir "$env:RUNNER_TEMP\neocortex-input-wheels" --constraints constraints.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --find-links "$env:RUNNER_TEMP\neocortex-input-wheels" --constraint constraints.txt ".[full]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/pyright_runtime.py install --target "$env:RUNNER_TEMP\pyright"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/pyright_runtime.py verify --target "$env:RUNNER_TEMP\pyright"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\pyright\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows identity, Job Object, NTFS and trusted-deep fixtures
        shell: pwsh
        env:
          NEOCORTEX_RUN_REAL_MUTATION_ACCEPTANCE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\pytest-deep-windows" `
            tests/test_bounded_subprocess.py `
            tests/test_corpus_access_policy.py `
            tests/test_durable_mutation_boundary.py `
            tests/test_framework_actions_identity_bound.py `
            tests/test_release_windows.py `
            tests/test_release_windows_ntfs.py `
            tests/test_trusted_deep_configuration.py
      - name: Verify final candidate snapshot
        if: always()
        shell: pwsh
        run: |
          python tools/quality_gate.py git-snapshot --sha "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deep-linux:
    name: Deep Linux portable/containment/installer · Python 3.14
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Bootstrap audited pip
        run: python -I tools/bootstrap_pip.py
      - name: Install system fixture dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          qpdf ffmpeg tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          tesseract-ocr-deu tesseract-ocr-chi-sim tesseract-ocr-chi-tra
          tesseract-ocr-osd desktop-file-utils libegl1
      - name: Install full constrained source from wheels
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraints constraints.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraint constraints.txt ".[full]"
      - name: Portable inventory, POSIX containment and installer contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${RUNNER_TEMP}/pytest-deep-linux"
          tests/test_linux_platform_policy.py
          tests/test_posix_containment.py
          tests/test_release_linux.py
          tests/test_inventory_exclusion_policy.py
          tests/test_bounded_subprocess.py
          tests/test_image_ocr_profiles.py
          tests/test_ui_linux.py
          tests/test_ui_read_client.py
          tests/test_ui_readonly.py
          tests/test_ui_smoke.py
          tests/test_ocr_profiles.py
          tests/test_pdf_ocr_profiles.py
          tests/test_video_content_types.py
          tests/test_video_frames.py
          tests/test_video_probe.py
          tests/test_video_route.py
          tests/test_video_state.py
      - name: Verify final candidate snapshot
        if: always()
        run: python tools/quality_gate.py git-snapshot --sha "$GITHUB_SHA"
