name: Neocortex CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

concurrency:
  group: neocortex-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast lint · Ubuntu · Python 3.14
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install constrained base runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraints constraints.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraint constraints.txt .

      - name: Ruff changed-source contracts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]]; then
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "$base" "$GITHUB_SHA" -- '*.py')
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD -- '*.py')
          fi
          targets=()
          for candidate in "${changed[@]}"; do
            [[ -f "$candidate" ]] && targets+=("$candidate")
          done
          ((${#targets[@]})) || targets=("_04_Nucleo_Operativo/code_contracts.py")
          printf 'Ruff target: %s\n' "${targets[@]}"
          python -m ruff check --no-cache "${targets[@]}"
          python -m ruff format --check --no-cache "${targets[@]}"

      - name: Fast cross-platform contracts
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${RUNNER_TEMP}/pytest-fast"
          tests/test_agent_server.py
          tests/test_packaging_entrypoint.py
          tests/test_archive_cli.py
          tests/test_archive_route.py
          tests/test_build_binary_inputs.py
          tests/test_cli_import_isolation.py
          tests/test_cli_capabilities.py
          tests/test_cli_modularization.py
          tests/test_human_cli.py
          tests/test_linux_memory_probe.py
          tests/test_linux_platform_policy.py
          tests/test_model_management.py
          tests/test_posix_containment.py
          tests/test_read_api.py
          tests/test_release_linux.py
          tests/test_route_schema_contracts.py
          tests/test_semantic_lexical.py
          tests/test_semantic_quality.py
          tests/test_text_route.py
          tests/test_value_cli_adapter.py
          tests/test_value_review_contracts.py
          tests/test_value_review_sqlite.py
          tests/test_zip_safety.py

  standard:
    name: Wheel · ${{ matrix.os }} · Python ${{ matrix.python }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ubuntu Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1

      - name: Build constrained wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          mkdir -p "$RUNNER_TEMP/neocortex-wheel"
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-wheel" \
            --constraints constraints.txt
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/neocortex-wheel"
          [[ $(find "$RUNNER_TEMP/neocortex-wheel" -maxdepth 1 -name 'neocortex_framework-*.whl' | wc -l) -eq 1 ]]

      - name: Install full wheel using binary artifacts only
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$RUNNER_TEMP/neocortex-wheel" -maxdepth 1 -name 'neocortex_framework-*.whl' -print -quit)
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --find-links "$RUNNER_TEMP/neocortex-wheel" \
            --constraint constraints.txt "${wheel}[full]"
          python -m pip check

      - name: Verify site-packages imports and public entrypoint
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/wheel-origin-probe"
          mkdir -p "$probe"
          cd "$probe"
          python -I -c "import pathlib,neocortex,_04_Nucleo_Operativo; p=pathlib.Path(neocortex.__file__).resolve(); assert 'site-packages' in p.parts, p"
          python -I -m neocortex --version
          python -I -m neocortex doctor platform --json
          python -I -c "import PIL,PySide6,ctranslate2,fastembed,faster_whisper,fitz,nudenet,numpy,pytesseract"

      - name: Installed-wheel standard suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          suite="$RUNNER_TEMP/neocortex-standard-suite"
          mkdir -p "$suite"
          cp -R tests "$suite/tests"
          cd "$suite"
          export PYTHONPATH="$suite"
          python -m pytest -q --import-mode=importlib -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/pytest-standard" \
            tests/test_agent_server.py \
            tests/test_app_paths.py \
            tests/test_archive_cli.py \
            tests/test_archive_route.py \
            tests/test_application_config.py \
            tests/test_audio_route.py \
            tests/test_bounded_subprocess.py \
            tests/test_cli_capabilities.py \
            tests/test_cli_modularization.py \
            tests/test_cli_operations_registry.py \
            tests/test_cli_video_surface.py \
            tests/test_framework_schema_contract.py \
            tests/test_human_cli.py \
            tests/test_image_ocr_profiles.py \
            tests/test_inventory_exclusion_policy.py \
            tests/test_linux_platform_policy.py \
            tests/test_model_management.py \
            tests/test_ocr_profiles.py \
            tests/test_office_route.py \
            tests/test_pdf_ocr_profiles.py \
            tests/test_posix_containment.py \
            tests/test_read_api.py \
            tests/test_route_schema_contracts.py \
            tests/test_semantic_lexical.py \
            tests/test_semantic_quality.py \
            tests/test_semantic_service.py \
            tests/test_semantic_service_contracts.py \
            tests/test_semantic_service_facade.py \
            tests/test_semantic_sources.py \
            tests/test_semantic_state.py \
            tests/test_image_route.py \
            tests/test_text_route.py \
            tests/test_ui_elevation.py \
            tests/test_ui_linux.py \
            tests/test_ui_read_client.py \
            tests/test_ui_readonly.py \
            tests/test_ui_run_request.py \
            tests/test_ui_smoke.py \
            tests/test_value_cli_adapter.py \
            tests/test_value_review_contracts.py \
            tests/test_value_review_sqlite.py \
            tests/test_video_content_types.py \
            tests/test_video_frames.py \
            tests/test_video_probe.py \
            tests/test_video_route.py \
            tests/test_video_state.py \
            tests/test_zip_safety.py

  deep-windows:
    name: Deep Windows NTFS · Python 3.14
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Install full constrained source and Pyright
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --constraint constraints.txt build==1.5.0 setuptools==83.0.0 wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_binary_inputs.py --wheel-dir "$env:RUNNER_TEMP\neocortex-input-wheels" --constraints constraints.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --find-links "$env:RUNNER_TEMP\neocortex-input-wheels" --constraint constraints.txt ".[full]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP\pyright" --ignore-scripts --no-audit --no-fund "pyright@1.1.411"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\pyright\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows identity, Job Object, NTFS and trusted-deep fixtures
        shell: pwsh
        env:
          NEOCORTEX_RUN_REAL_MUTATION_ACCEPTANCE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\pytest-deep-windows" `
            tests/test_bounded_subprocess.py `
            tests/test_corpus_access_policy.py `
            tests/test_durable_mutation_boundary.py `
            tests/test_framework_actions_identity_bound.py `
            tests/test_release_windows.py `
            tests/test_release_windows_ntfs.py `
            tests/test_trusted_deep_configuration.py

  deep-linux:
    name: Deep Linux portable/containment/installer · Python 3.14
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install system fixture dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          qpdf ffmpeg tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          tesseract-ocr-deu tesseract-ocr-chi-sim tesseract-ocr-chi-tra
          tesseract-ocr-osd desktop-file-utils libegl1
      - name: Install full constrained source from wheels
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --constraint constraints.txt \
            build==1.5.0 setuptools==83.0.0 wheel
          python tools/build_binary_inputs.py \
            --wheel-dir "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraints constraints.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/neocortex-input-wheels" \
            --constraint constraints.txt ".[full]"
      - name: Portable inventory, POSIX containment and installer contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${RUNNER_TEMP}/pytest-deep-linux"
          tests/test_linux_platform_policy.py
          tests/test_posix_containment.py
          tests/test_release_linux.py
          tests/test_inventory_exclusion_policy.py
          tests/test_bounded_subprocess.py
          tests/test_image_ocr_profiles.py
          tests/test_ui_linux.py
          tests/test_ui_read_client.py
          tests/test_ui_readonly.py
          tests/test_ui_smoke.py
          tests/test_ocr_profiles.py
          tests/test_pdf_ocr_profiles.py
          tests/test_video_content_types.py
          tests/test_video_frames.py
          tests/test_video_probe.py
          tests/test_video_route.py
          tests/test_video_state.py
