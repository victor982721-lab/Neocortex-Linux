rules:
  # These rules are intentionally local, syntactic guardrails.  They do not
  # replace pytest, Ruff, a type checker, or the runtime's fail-closed checks.
  # The product scope is deliberate: this file is not a repository-wide
  # generic security ruleset.  Positive and negative examples are versioned
  # under the two fixture files listed below.
  - id: neo-no-shell-execution
    languages: [python]
    message: >-
      Do not invoke a shell from NeoCortex; use an allow-listed bounded helper
      and pass an argv sequence instead.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)

  - id: neo-no-eval-execution
    languages: [python]
    message: Do not evaluate dynamically supplied Python or corpus content.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: neo-no-os-system
    languages: [python]
    message: Do not use os.system or an os process-spawning primitive.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: os.execv(...)
          - pattern: os.execve(...)
          - pattern: os.execl(...)
          - pattern: os.execlp(...)
          - pattern: os.execlpe(...)
          - pattern: os.spawnv(...)
          - pattern: os.spawnve(...)

  - id: neo-no-corpus-execution
    languages: [python]
    message: Do not execute a file or module from the corpus.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
    patterns:
      - pattern-either:
          - pattern: runpy.run_path(...)
          - pattern: runpy.run_module(...)

  - id: neo-sqlite-unsafe-read
    languages: [python]
    message: >-
      Do not open a published SQLite owner with sqlite3.connect; use the
      fenced immutable/snapshot read surface instead.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
      # These modules are the only current direct sqlite3.connect owners.  They
      # either create/write an owner, materialize a private snapshot, or expose
      # the fenced immutable reader.  A new direct connection elsewhere must
      # use the public fenced surface or intentionally add a reviewed exception.
      exclude:
        - /neocortex/capabilities/formats/image/state.py
        - /neocortex/deduplication/persistence/connections.py
        - /neocortex/documents/document_cache_sync.py
        - /neocortex/enumeration/path_index/schema.py
        - /neocortex/persistence/framework_connection.py
        - /neocortex/persistence/framework_route_state.py
        - /neocortex/persistence/framework_state_writer.py
        # state_reset.py opens only a verified backup-derived staging copy.
        - /neocortex/persistence/state_reset.py
        - /neocortex/persistence/sqlite_connection.py
        - /neocortex/persistence/sqlite_immutable.py
        - /neocortex/persistence/sqlite_writer_snapshot.py
        - /neocortex/semantic/semantic_plan_owners.py
        - /neocortex/semantic/semantic_plan_scratch.py
        - /neocortex/semantic/semantic_schema.py
        - /neocortex/workflow/retention/planner.py
    patterns:
      - pattern: sqlite3.connect($DATABASE, ...)
      - pattern-not: sqlite3.connect(":memory:", ...)

  - id: neo-subprocess-without-limits
    languages: [python]
    message: >-
      Every subprocess must have an explicit timeout or child/resource limit;
      prefer the bounded subprocess helper.
    severity: ERROR
    paths:
      include:
        - /neocortex/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
      # The sole direct Popen in product code is the implementation of the
      # bounded subprocess primitive.  Its timeout, output, memory and child
      # lifecycle bounds are enforced by the surrounding protocol rather than
      # by a Popen constructor keyword.
      exclude:
        - /neocortex/runtime/control/bounded_subprocess.py
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
          - pattern: subprocess.Popen(...)
      - pattern-not: subprocess.run(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.call(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.check_call(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.check_output(..., timeout=$TIMEOUT, ...)
      - pattern-not: subprocess.Popen(..., preexec_fn=$LIMITER, ...)

  - id: neo-mutation-without-grant-fence
    languages: [python]
    message: >-
      Corpus mutation must stay inside an explicit grant_fence context; a
      static path check is not a substitute for grant and fence revalidation.
    severity: ERROR
    paths:
      include:
        - /neocortex/curation/**/*.py
        - /neocortex/safety/**/*.py
        - /tests/fixtures/semgrep_invariants/positive.py
        - /tests/fixtures/semgrep_invariants/negative.py
      # Restore removes .trashinfo only after a grant/root/receipt-bound
      # postcondition check.  It is a cleanup step, not an unguarded corpus
      # mutation frontier, and is kept as an explicit file-level exception.
      exclude:
        - /neocortex/curation/recovery.py
    patterns:
      - pattern-either:
          - pattern: os.remove(...)
          - pattern: os.unlink(...)
          - pattern: os.rename(...)
          - pattern: os.replace(...)
          - pattern: shutil.move(...)
      - pattern-not-inside: |
          with grant_fence(...):
              ...
