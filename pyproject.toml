[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neocortex-framework"
dynamic = ["version"]
description = "Linux-first incremental personal content framework"
readme = "README.md"
authors = [{name = "Víctor"}]
maintainers = [{name = "Víctor"}]
license = "LicenseRef-Proprietary"
requires-python = ">=3.13.5,<3.14"
classifiers = [
    "Private :: Do Not Upload",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "packaging>=26,<27",
    "rich>=15,<16",
]

[project.urls]
Homepage = "https://github.com/victor982721-lab/Neocortex-Linux"
Repository = "https://github.com/victor982721-lab/Neocortex-Linux.git"
Issues = "https://github.com/victor982721-lab/Neocortex-Linux/issues"

[project.scripts]
Neocortex = "neocortex.interface.entrypoint:entrypoint"

[project.optional-dependencies]
agent = [
    "mcp==1.29.0",
]
# Build frontend and base tests are independent of optional runtimes/analyzers.
# Packaging audit tests import the same isolated backend declared by
# [build-system]; keeping it here does not add it to the product runtime.
build = [
    "build>=1.5,<2",
]
test-base = [
    "pytest>=9.1,<10",
    "setuptools==83.0.0",
]
# Development-only tools for individual checks; never required by the runtime.
analysis = [
    "complexipy>=6.2,<7",
    "cosmic-ray>=8.4.6,<8.5",
    "coverage>=7.14,<8",
    "deptry>=0.25,<0.26",
    "grimp>=3.15,<4",
    "mypy>=2.1,<3",
    "pip-audit>=2.10,<2.11",
    "pytest>=9.1,<10",
    "radon>=6.0.1,<7",
    "ruff>=0.15,<0.16",
    "sqlglot>=30.17,<31",
    "vulture>=2.16,<2.17",
]
documents = [
    "Pillow>=12.3,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "pytesseract>=0.3.13,<0.4",
]
audio = [
    "ctranslate2>=4.8,<5",
    "faster-whisper>=1.2,<2",
]
image = [
    "Pillow>=12.3,<13",
]
semantic = [
    "fastembed==0.8.0",
    "numpy>=2.1,<3",
    "threadpoolctl>=3.6,<4",
    "Pillow>=12.3,<13",
]
full = [
    "ctranslate2>=4.8,<5",
    "fastembed==0.8.0",
    "faster-whisper>=1.2,<2",
    "mcp==1.29.0",
    "numpy>=2.1,<3",
    "threadpoolctl>=3.6,<4",
    "Pillow>=12.3,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "pytesseract>=0.3.13,<0.4",
]
dev = [
    # Compatibility alias for existing development environments; use build for
    # a build-only environment and test-base for base tests plus packaging
    # backend audits.
    "build>=1.5,<2",
]

[tool.ruff]
# Keep the source syntax compatible with the oldest supported interpreter.
target-version = "py313"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Trusted analysis adds bug-prone and maintainability checks without turning
# import order, formatting, pytest style or modernization churn into findings.
# The protected provider continues to use only E4/E7/E9/F.
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "RUF"]
ignore = [
    "RUF012", # Mutable ClassVar annotations require a separate typing migration.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
# Type-check against the only supported runtime floor; installed-wheel gates use CPython 3.13.
# R1-R4 benchmark/metric artifacts are hash-pinned acceptance inputs and are
# intentionally audited as sealed data rather than edited for static cleanup.
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = "(?x)(^|/)(build|dist|node_modules|\\.venv|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache)/|(^|/)(tools/benchmark_knowledge_functional\\.py|tools/knowledge_development_measurement\\.py|tools/knowledge_functional_v2_metrics\\.py|tools/knowledge_scoped_observation_metrics\\.py)"

[tool.pyright]
# Keep static analysis aligned with the CPython 3.13-only runtime contract.
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"
reportImportCycles = "warning"
# The personal Linux quality environment is intentionally outside the product
# package.  Resolve it relative to this canonical checkout so source archives
# do not embed a private absolute path; callers in another checkout may still
# override it with Pyright's ``--venvpath`` option.
venvPath = "../../.local/share/Neocortex/tooling"
venv = "quality-cp313-20260920"
extraPaths = ["."]
exclude = [
    # Semgrep positive/negative fixtures intentionally contain invalid calls
    # to exercise syntax rules and are not product Python.
    "**/tests/fixtures/semgrep_invariants/**",
    # Hash-pinned R1-R4 acceptance artifacts; no static rewrite is authorized.
    "**/tools/benchmark_knowledge_functional.py",
    "**/tools/knowledge_development_measurement.py",
    "**/tools/knowledge_functional_v2_metrics.py",
    "**/tools/knowledge_scoped_observation_metrics.py",
]

[tool.setuptools.dynamic]
version = {attr = "neocortex.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "neocortex*",
]

[tool.setuptools.package-data]
"neocortex" = ["py.typed"]
