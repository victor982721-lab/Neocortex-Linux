[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neocortex-framework"
dynamic = ["version"]
description = "Cross-platform incremental personal content framework for Windows and Linux"
readme = "README.md"
requires-python = ">=3.13,<3.15"
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "complexipy>=6.2,<7",
    "cosmic-ray>=8.4.6,<8.5",
    "coverage>=7.14,<8",
    "deptry>=0.25,<0.26",
    "grimp>=3.15,<4",
    "mcp==1.29.0",
    "mypy>=2.1,<3",
    "packaging>=26,<27",
    "pip-audit>=2.10,<2.11",
    "pytest>=9.1,<10",
    "radon>=6.0.1,<7",
    "rich>=15,<16",
    "ruff>=0.15,<0.16",
    "vulture>=2.16,<2.17",
    "xxhash>=3.8,<4",
]

[project.scripts]
Neocortex = "neocortex.cli:entrypoint"

[project.optional-dependencies]
documents = [
    "Pillow>=12.3,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "pytesseract>=0.3.13,<0.4",
]
audio = [
    "ctranslate2>=4.8,<5",
    "faster-whisper>=1.2,<2",
]
image = [
    "nudenet>=3.4.2,<4",
    "Pillow>=12.3,<13",
]
semantic = [
    "fastembed==0.8.0",
    "numpy>=2.1,<3",
    "Pillow>=12.3,<13",
]
ui = [
    "PySide6>=6.11,<7",
]
full = [
    "ctranslate2>=4.8,<5",
    "fastembed==0.8.0",
    "faster-whisper>=1.2,<2",
    "nudenet>=3.4.2,<4",
    "numpy>=2.1,<3",
    "Pillow>=12.3,<13",
    "PyMuPDF>=1.27,<2",
    "pdfminer.six>=20260107",
    "PySide6>=6.11,<7",
    "pytesseract>=0.3.13,<0.4",
]
dev = [
    "build>=1.5,<2",
]

[tool.ruff]
# Keep the source syntax compatible with the oldest supported interpreter.
target-version = "py313"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
# Trusted analysis adds bug-prone and maintainability checks without turning
# import order, formatting, pytest style or modernization churn into findings.
# The protected provider continues to use only E4/E7/E9/F.
select = ["E4", "E7", "E9", "F", "B", "C4", "PIE", "RUF"]
ignore = [
    "RUF012", # Mutable ClassVar annotations require a separate typing migration.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
# Type-check against the supported floor; the installed-wheel CI also runs on 3.14.
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = "(?x)(^|/)(build|dist|node_modules|\\.venv|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache)/"

[tool.pyright]
# Preserve 3.13-compatible source while runtime validation covers CPython 3.14.
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"
reportImportCycles = "warning"

[tool.setuptools]
py-modules = ["Orquestador"]

[tool.setuptools.dynamic]
version = {attr = "neocortex.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = [
    "neocortex*",
    "_01_Enumeracion*",
    "_02_Deduplicacion*",
    "_03_Progreso*",
    "_04_Nucleo_Operativo*",
    "_05_Interfaz*",
]

[tool.setuptools.package-data]
"neocortex" = ["py.typed"]
"_04_Nucleo_Operativo" = ["py.typed", "semgrep_rules/*.yml"]
"_05_Interfaz" = ["assets/*.svg", "assets/*.png", "assets/*.ico"]
