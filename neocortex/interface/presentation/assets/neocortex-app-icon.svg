<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="150" y1="90" x2="865" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17231D"/>
      <stop offset="0.58" stop-color="#0D1511"/>
      <stop offset="1" stop-color="#080D0B"/>
    </linearGradient>
    <linearGradient id="page" x1="280" y1="245" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#203029"/>
      <stop offset="1" stop-color="#111B16"/>
    </linearGradient>
    <linearGradient id="accent" x1="290" y1="320" x2="730" y2="705" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9F7A7"/>
      <stop offset="0.42" stop-color="#83D944"/>
      <stop offset="1" stop-color="#50B96A"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#83D944" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#83D944" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile; the outer corners remain transparent. -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#background)"/>
  <rect x="60" y="60" width="904" height="904" rx="212" fill="none" stroke="#83D944" stroke-opacity="0.15" stroke-width="4"/>
  <ellipse cx="512" cy="465" rx="390" ry="365" fill="url(#aura)"/>

  <!-- Offset paper layer and main folded document. -->
  <path d="M284 282H676L820 426V789C820 831 786 865 744 865H284C242 865 208 831 208 789V358C208 316 242 282 284 282Z"
        fill="#0A110D" stroke="#274236" stroke-width="24" opacity="0.82" filter="url(#shadow)"/>
  <path d="M244 235H672L792 355V757C792 799 758 833 716 833H244C202 833 168 799 168 757V311C168 269 202 235 244 235Z"
        fill="url(#page)" stroke="#42634F" stroke-width="22"/>
  <path d="M672 235V327C672 343 685 355 700 355H792" fill="#2B4437" stroke="#42634F" stroke-width="22" stroke-linejoin="round"/>

  <!-- Neural/cortical contour surrounding the N. -->
  <g fill="none" stroke="#B7EDA0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.88">
    <path d="M326 350C267 319 218 357 235 415C190 444 199 514 247 535C214 584 247 654 318 655"/>
    <path d="M698 350C757 319 806 357 789 415C834 444 825 514 777 535C810 584 777 654 706 655"/>
  </g>

  <!-- Compact circuit branches and terminal nodes. -->
  <g fill="none" stroke="#6BCB55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 416H202L184 398"/>
    <path d="M242 538H198L178 558"/>
    <path d="M780 416H822L840 398"/>
    <path d="M782 538H826L846 558"/>
  </g>
  <g fill="#C9F7A7" stroke="#101A14" stroke-width="10">
    <circle cx="174" cy="388" r="18"/>
    <circle cx="168" cy="568" r="18"/>
    <circle cx="850" cy="388" r="18"/>
    <circle cx="856" cy="568" r="18"/>
  </g>

  <!-- The primary N: dark separation stroke plus luminous neural stroke. -->
  <path d="M324 688V340L700 688V340" fill="none" stroke="#09100C" stroke-width="154" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M324 688V340L700 688V340" fill="none" stroke="url(#accent)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M324 688V340L700 688V340" fill="none" stroke="#DDFBCB" stroke-opacity="0.24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(-14 -10)"/>

  <!-- Document text/layer cues, deliberately broad enough to survive small sizes. -->
  <g fill="#42634F">
    <rect x="284" y="765" width="272" height="22" rx="11"/>
    <rect x="576" y="765" width="100" height="22" rx="11"/>
  </g>
  <circle cx="715" cy="776" r="16" fill="#83D944"/>
</svg>
