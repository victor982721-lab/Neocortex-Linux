# Neocortex-local Codex policy. Model, provider, authentication, MCP and telemetry
# continue to inherit from the user configuration.
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
# Machine-specific writable roots and elevation policy belong in the local user
# configuration, not in this portable repository.
