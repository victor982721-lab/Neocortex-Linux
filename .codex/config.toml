# NeoCortex-local Codex policy. Root model, provider, authentication and telemetry
# inherit from the user configuration; bounded workers use the defaults below.
approval_policy = "on-request"
default_permissions = "neocortex-main"
approvals_reviewer = "auto_review"
allow_login_shell = false

[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 16
default_wait_timeout_ms = 120000
root_agent_usage_hint_text = """
En NeoCortex, aplica docs/subprojects/development-release.md#cobertura-por-ronda:
una tarea principal, matriz de contratos/riesgos afectados y ownership disjunto.
La cobertura de la ronda, no el numero de actores, decide la finalizacion.
Usa oleadas para cubrir todos los frentes independientes, revision critica
independiente y un integrador. Selecciona explicitamente gpt-6-astra/max para
coordinadores anidados; los defaults Luna/max son para hojas acotadas.
No crees tareas visibles como sustituto de una
herramienta de subagentes ausente ni confundas instrucciones con aislamiento.
"""
subagent_usage_hint_text = """
Conserva el alcance, las celdas de cobertura y el unico escritor asignados.
Devuelve evidencia localizada, casos positivos/adversariales y limites, no
transcripciones. Delega descendientes solo si tu namespace nativo lo permite
y aportan cobertura distinta; si no, devuelve los frentes pendientes a la raiz.
No publiques, cambies el SSOT ni ejecutes el gate pesado compartido.
"""


[permissions.neocortex-main]
extends = ":workspace"

[permissions.neocortex-main.filesystem]
"/home/winterboss/Neocortex/Repository/.git" = "write"

[permissions.neocortex-main.network]
enabled = true
mode = "full"
enable_socks5 = false
enable_socks5_udp = false
allow_upstream_proxy = false
allow_local_binding = false
dangerously_allow_non_loopback_proxy = false
dangerously_allow_all_unix_sockets = false

[permissions.neocortex-main.network.domains]
"github.com" = "allow"

[features.network_proxy]
enabled = true

[mcp_servers.neocortex_readonly_pilot]
command = "/home/winterboss/.local/bin/Neocortex"
args = ["agent", "serve"]
enabled = false
required = false
startup_timeout_sec = 30
tool_timeout_sec = 30
enabled_tools = ["status", "lifecycle_status", "search", "context", "evidence", "inspect_code", "lineage"]

[mcp_servers.neocortex_readonly_pilot.tools.context]
output_token_limit = 4000

[mcp_servers.neocortex_readonly_pilot.tools.evidence]
output_token_limit = 4000

[mcp_servers.neocortex_readonly_pilot.tools.status]
output_token_limit = 1500
